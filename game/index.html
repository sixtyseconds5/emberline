<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberline — hold the line</title>
<meta name="description" content="Emberline: a 2D arena survival game. Fly one ship through ten waves, upgrade between them, and bring down the Maw.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #05070f; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberline: fly the ship, shoot the ember hostiles, survive ten waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
